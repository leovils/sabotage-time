<script>
const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxEkX2yCY8xL2DPoyUZ7ikHT2cL1l9AiLcbBhx7VCfYLmdzybGCtQzPdcaqWYpZvfMu/exec";

let questoesBanco = [];

function mostrar(id) { document.getElementById(id).classList.add("ativo"); }
function ocultar(id) { document.getElementById(id).classList.remove("ativo"); }

// QUESTÕES HARDCODED (180 questões)
const QUESTOES_BANCO = [{"q":"Um pesquisador quer investigar se o número de horas de treino com espada (variável X) influencia a quantidade de vitórias em combate (variável Y) entre guerreiros vikings. Nesse desenho, qual é a variável dependente?","opcoes":["Número de horas de treino com espada","Quantidade de vitórias em combate","Tipo de espada utilizada","Idade do guerreiro"],"resp":1},{"q":"O Jarl classifica seus guerreiros em: 'Berserkr', 'Ulfheðnar' e 'Einherjar'. Que tipo de escala de mensuração está sendo utilizado?","opcoes":["Nominal","Ordinal","Intervalar","Razão"],"resp":0},{"q":"Um estudo mede a temperatura em graus Celsius dentro de diferentes salões de banquete em Midgard. Essa medida utiliza qual escala?","opcoes":["Nominal","Ordinal","Intervalar","Razão"],"resp":2},{"q":"Em um experimento, clãs vikings são aleatoriamente designados para receber treinamento com arco ou com lança. O pesquisador mede o desempenho em batalha após 6 meses. Qual o desenho de pesquisa?","opcoes":["Estudo de caso","Survey transversal","Experimento com grupo controle aleatorizado","Estudo correlacional"],"resp":2},{"q":"Um pesquisador hipotetiza que a confiança no Jarl (X) aumenta a disposição para batalha (Y), mas somente quando o guerreiro possui alta coesão com o clã (W). Nesse modelo, a coesão com o clã funciona como:","opcoes":["Variável mediadora","Variável moderadora","Variável dependente","Variável de controle"],"resp":1},{"q":"Um estudo propõe que a liderança do Jarl (X) aumenta a motivação dos guerreiros (M), que por sua vez aumenta o desempenho em batalha (Y). A motivação dos guerreiros funciona como:","opcoes":["Variável moderadora","Variável mediadora","Variável independente","Variável de confusão"],"resp":1},{"q":"Um questionário mede 'lealdade ao Jarl' com 5 itens Likert. Ao aplicar o instrumento duas vezes com intervalo de 2 semanas aos mesmos guerreiros, obtém-se correlação de 0.92. Esse procedimento avalia qual propriedade psicométrica?","opcoes":["Validade de conteúdo","Validade de construto","Confiabilidade teste-reteste","Validade preditiva"],"resp":2},{"q":"Um pesquisador operacionaliza 'força de combate' como o peso máximo que o guerreiro levanta na forja. Críticos argumentam que força de combate envolve também agilidade, resistência e técnica — não apenas força bruta. Essa crítica refere-se a um problema de:","opcoes":["Confiabilidade interna","Validade de construto","Erro amostral","Multicolinearidade"],"resp":1},{"q":"Em um estudo quasi-experimental, aldeias vikings que voluntariamente adotaram novas técnicas agrícolas são comparadas com aldeias que não adotaram. A principal ameaça à validade interna neste desenho é:","opcoes":["Mortalidade experimental","Viés de seleção (auto-seleção dos grupos)","Efeito teto","Erro de mensuração aleatório"],"resp":1},{"q":"Um pesquisador mede a satisfação dos guerreiros com o hidromel do salão e a intenção de permanecer no clã usando o mesmo questionário, respondido pelo mesmo guerreiro, no mesmo momento. Qual viés metodológico é mais provável?","opcoes":["Viés de sobrevivência","Viés de método comum (Common Method Bias)","Viés de publicação","Falácia ecológica"],"resp":1},{"q":"Um ferreiro de Asgard registrou o peso (em kg) de 5 espadas forjadas: 2, 3, 3, 4, 8. Qual é a mediana desse conjunto?","opcoes":["3","4","3.5","8"],"resp":0},{"q":"As idades de 6 guerreiros selecionados para uma expedição são: 20, 22, 25, 25, 30, 35. Qual é a moda?","opcoes":["25","26.17","27.5","20"],"resp":0},{"q":"O Jarl quer saber a medida de dispersão que considera todos os valores e é expressa na mesma unidade que os dados originais. Qual medida ele deve usar?","opcoes":["Variância","Amplitude","Desvio padrão","Coeficiente de variação"],"resp":2},{"q":"Em um boxplot da produção de hidromel de 50 aldeias, o que representam os 'bigodes' (whiskers)?","opcoes":["A média e o desvio padrão","O primeiro e o terceiro quartis","Os valores mínimo e máximo dentro de 1.5 × IQR dos quartis","Os percentis 5 e 95"],"resp":2},{"q":"A distribuição do peso de ouro saqueado por 200 guerreiros apresenta uma cauda longa à direita. Nessa situação, qual relação entre média, mediana e moda é mais provável?","opcoes":["Média < Mediana < Moda","Média = Mediana = Moda","Moda < Mediana < Média","Mediana < Moda < Média"],"resp":2},{"q":"Um guerreiro obteve z-score = −1.5 em um teste de pontaria com arco. O que isso significa?","opcoes":["Ele acertou 1.5 alvos a menos que a média","Seu desempenho está 1.5 desvios padrão abaixo da média do grupo","Ele está no percentil 15 da distribuição","A probabilidade de seu resultado é 1.5%"],"resp":1},{"q":"A produção de barris de hidromel em duas aldeias tem a mesma média (50 barris), mas a Aldeia A tem desvio padrão de 5 e a Aldeia B tem desvio padrão de 15. O que se pode concluir?","opcoes":["A Aldeia B produz mais hidromel em média","A Aldeia A tem produção mais homogênea e previsível","As duas aldeias têm a mesma variabilidade","A Aldeia A tem mais outliers"],"resp":1},{"q":"Uma distribuição do tempo de forja de espadas apresenta curtose (excesso) igual a +4.2. Comparada à distribuição normal, essa distribuição é:","opcoes":["Platicúrtica — mais achatada, com caudas leves","Mesocúrtica — idêntica à normal","Leptocúrtica — mais concentrada no centro e com caudas pesadas","Assimétrica negativa"],"resp":2},{"q":"Os saques de 100 expedições têm Q1 = 30 moedas e Q3 = 70 moedas. Pelo critério do boxplot (1.5 × IQR), a partir de qual valor um saque seria classificado como outlier superior?","opcoes":["Acima de 100 moedas","Acima de 110 moedas","Acima de 130 moedas","Acima de 150 moedas"],"resp":2},{"q":"Um pesquisador compara a variabilidade do peso de espadas (média = 3 kg, DP = 0.6 kg) com a variabilidade do comprimento de lanças (média = 200 cm, DP = 20 cm). Qual medida permite comparação direta entre as duas variáveis?","opcoes":["Variância de cada variável","Desvio padrão padronizado (z-score)","Coeficiente de variação (CV = DP/Média × 100)","Amplitude interquartil (IQR)"],"resp":2},{"q":"Em um saco com 4 runas vermelhas e 6 runas azuis, qual a probabilidade de sortear uma runa vermelha ao acaso?","opcoes":["0.60","0.40","0.50","0.67"],"resp":1},{"q":"Na distribuição normal padrão (Z), aproximadamente qual percentual dos dados está entre −1 e +1 desvios padrão da média?","opcoes":["50%","68%","95%","99.7%"],"resp":1},{"q":"Dois eventos são mutuamente exclusivos quando:","opcoes":["A ocorrência de um não afeta a probabilidade do outro","Ambos ocorrem simultaneamente com alta probabilidade","A ocorrência de um impede a ocorrência do outro","A probabilidade conjunta é igual ao produto das probabilidades individuais"],"resp":2},{"q":"Se a força de guerreiros segue uma distribuição normal com média 100 e desvio padrão 15, qual é o z-score de um guerreiro com força 130?","opcoes":["1.0","1.5","2.0","3.0"],"resp":2},{"q":"O Teorema Central do Limite (TCL) afirma que, à medida que o tamanho da amostra aumenta, a distribuição das médias amostrais:","opcoes":["Se aproxima da distribuição uniforme, independentemente da população","Se aproxima da distribuição normal, independentemente da forma da distribuição original","Mantém a mesma forma da distribuição original da população","Converge para uma distribuição qui-quadrado"],"resp":1},{"q":"Um oráculo de Midgard estima que 5% dos guerreiros carregam uma marca rúnica especial. Se dois guerreiros são selecionados independentemente ao acaso, qual a probabilidade de ambos terem a marca?","opcoes":["0.10","0.05","0.0025","0.025"],"resp":2},{"q":"A distribuição t de Student, comparada à distribuição normal padrão, apresenta:","opcoes":["Caudas mais leves e pico mais alto","Caudas mais pesadas e pico mais baixo, convergindo para a normal com n grande","Formato idêntico à normal, independentemente do tamanho amostral","Assimetria positiva quando os graus de liberdade são baixos"],"resp":1},{"q":"Na feira de Birka, 60% dos mercadores vendem especiarias e 30% vendem tecidos. Sabendo que 10% vendem ambos, qual a probabilidade de um mercador escolhido ao acaso vender especiarias OU tecidos (regra da adição)?","opcoes":["0.90","0.80","0.70","1.00"],"resp":1},{"q":"Um teste rúnico detecta berserkrs com sensibilidade de 90% e especificidade de 95%. Na população, 2% são berserkrs. Se um guerreiro testa positivo, qual é a probabilidade aproximada de ele realmente ser berserkr (Teorema de Bayes)?","opcoes":["Aproximadamente 90%","Aproximadamente 27%","Aproximadamente 50%","Aproximadamente 2%"],"resp":1},{"q":"Uma população de aldeias tem distribuição de renda fortemente assimétrica à direita (μ = 200, σ = 80). Se amostras de n = 64 aldeias forem repetidamente coletadas, qual será o erro padrão da distribuição amostral das médias?","opcoes":["80","40","10","1.25"],"resp":2},{"q":"Um pesquisador seleciona guerreiros numerando todos os 500 do exército e usando uma tabela de números aleatórios para escolher 50. Qual método de amostragem foi utilizado?","opcoes":["Amostragem estratificada","Amostragem por conveniência","Amostragem aleatória simples","Amostragem por cotas"],"resp":2},{"q":"Um Jarl divide seus guerreiros em 3 grupos (arqueiros, lanceiros, espadachins) e sorteia aleatoriamente guerreiros de cada grupo proporcionalmente. Qual método de amostragem está sendo usado?","opcoes":["Amostragem aleatória simples","Amostragem estratificada","Amostragem por conglomerados","Amostragem por conveniência"],"resp":1},{"q":"Um intervalo de confiança de 95% para a força média dos guerreiros é [85, 115]. Qual a interpretação correta?","opcoes":["95% dos guerreiros têm força entre 85 e 115","Há 95% de probabilidade de que a média populacional esteja entre 85 e 115","Se repetirmos o procedimento muitas vezes, 95% dos intervalos construídos conterão a verdadeira média populacional","A média amostral está 95% próxima da média populacional"],"resp":2},{"q":"Qual dos seguintes fatores NÃO afeta a largura de um intervalo de confiança para a média?","opcoes":["Tamanho da amostra","Nível de confiança escolhido","Desvio padrão da amostra","Valor da média populacional"],"resp":3},{"q":"Um pesquisador quer reduzir pela metade a margem de erro de sua estimativa da produção média de hidromel. Mantendo o nível de confiança, ele precisa:","opcoes":["Dobrar o tamanho da amostra","Quadruplicar o tamanho da amostra","Reduzir o nível de confiança de 95% para 90%","Usar amostragem por conveniência"],"resp":1},{"q":"Ao mudar de um intervalo de confiança de 95% para 99%, mantendo tudo mais constante, o que acontece?","opcoes":["O intervalo fica mais estreito e mais preciso","O intervalo fica mais largo, sacrificando precisão por maior confiança","A margem de erro diminui","O tamanho amostral necessário diminui"],"resp":1},{"q":"Um pesquisador seleciona 10 aldeias inteiras de um total de 100 aldeias e entrevista todos os moradores das aldeias escolhidas. Qual o método de amostragem?","opcoes":["Amostragem estratificada","Amostragem aleatória simples","Amostragem por conglomerados (clusters)","Amostragem sistemática"],"resp":2},{"q":"O erro amostral é definido como a diferença entre a estatística amostral e o parâmetro populacional. Qual das alternativas é VERDADEIRA sobre o erro amostral?","opcoes":["Pode ser completamente eliminado com amostragem aleatória","É um tipo de viés sistemático do pesquisador","Existe mesmo com amostragem aleatória perfeita e diminui com amostras maiores","Só ocorre em amostragem por conveniência"],"resp":2},{"q":"Em uma amostra de 36 guerreiros, a força média foi 100 com desvio padrão de 18. O IC 95% (z = 1.96) é aproximadamente:","opcoes":["[94.12, 105.88]","[97.06, 102.94]","[82.00, 118.00]","[91.00, 109.00]"],"resp":0},{"q":"Um pesquisador entrevista apenas os guerreiros que frequentam o salão de hidromel porque são de fácil acesso. Esse é um exemplo de amostragem por conveniência. A principal consequência é:","opcoes":["O erro padrão aumenta automaticamente","A inferência estatística formal (IC e testes) perde sua base teórica de generalização","Os resultados serão necessariamente enviesados para cima","O tamanho da amostra será sempre insuficiente"],"resp":1},{"q":"Em um teste de hipóteses, a hipótese nula (H₀) geralmente representa:","opcoes":["A hipótese que o pesquisador deseja confirmar","A afirmação de que não há efeito ou diferença na população","A hipótese alternativa quando o resultado é significativo","O valor do p-value antes da análise"],"resp":1},{"q":"O erro Tipo I ocorre quando:","opcoes":["Falhamos em rejeitar H₀ quando ela é falsa","Rejeitamos H₀ quando ela é verdadeira","O tamanho da amostra é muito grande","O p-value é maior que alpha"],"resp":1},{"q":"Se um pesquisador define alpha (α) = 0.05, isso significa que ele aceita uma probabilidade máxima de _____ de cometer um erro Tipo I.","opcoes":["5%","95%","50%","0.5%"],"resp":0},{"q":"Um teste qui-quadrado de independência é utilizado quando o pesquisador quer verificar:","opcoes":["Se a média de dois grupos é diferente","Se existe associação entre duas variáveis categóricas","Se a variância é homogênea entre grupos","Se a distribuição dos dados é normal"],"resp":1},{"q":"Um pesquisador obtém p = 0.03 em um teste sobre a resistência de escudos. Com α = 0.05, a interpretação CORRETA do p-value é:","opcoes":["Há 3% de probabilidade de que H₀ seja verdadeira","Há 97% de certeza de que H₁ é verdadeira","Se H₀ fosse verdadeira, a probabilidade de obter um resultado tão ou mais extremo seria 3%","O efeito tem magnitude de 3%"],"resp":2},{"q":"Um teste qui-quadrado de aderência (goodness of fit) avalia se a distribuição de guerreiros por clã (Urso, Lobo, Corvo, Serpente) difere da distribuição esperada de 25% cada. Se χ² = 2.1 com 3 gl e p = 0.55, a conclusão é:","opcoes":["Os clãs têm distribuição significativamente diferente da esperada","Não há evidência suficiente para rejeitar que a distribuição é uniforme","O teste é inconclusivo porque os graus de liberdade estão errados","Há evidência de que o clã async function iniciarJogo() {
  const nome = document.getElementById("nome").value.trim();
  const ra = document.getElementById("ra").value.trim();
  const programa = document.getElementById("programa").value;
  
  if (!nome || !ra || !programa) {
    alert("❌ Preencha todos os campos!");
    return;
  }
  
  sessionId = Date.now().toString();
  respondente = {
    nome: nome,
    ra: ra,
    programa: programa,
    ip: "capturando...",
    inicio: new Date().toLocaleTimeString(),
    questoes: [],
    respostas: [],
    idx_atual: 0,
    pular_usados: 3,
    eliminar_usados: 3,
    ajuda_usados: 3,
    status: "respondendo"
  };
  
  // Pega IP
  fetch("https://api.ipify.org?format=json")
    .then(r => r.json())
    .then(d => { respondente.ip = d.ip; })
    .catch(() => { respondente.ip = "desconhecido"; });
  
  // Sorteia 50 questões
  questoesSorteadas = [];
  const indices = [];
  while (questoesSorteadas.length < 50 && indices.length < questoesBanco.length) {
    const idx = Math.floor(Math.random() * questoesBanco.length);
    if (!indices.includes(idx)) {
      indices.push(idx);
      questoesSorteadas.push(questoesBanco[idx]);
    }
  }
  
  respondente.questoes = questoesSorteadas;
  
  ocultar("telaLogin");
  mostrar("telaJogo");
  carregarQuestao();
}

function carregarQuestao() {
  const idx = respondente.idx_atual;
  
  if (idx >= 50) {
    finalizarJogo();
    return;
  }
  
  const q = respondente.questoes[idx];
  
  document.getElementById("statusQuestao").textContent = `Questão ${idx + 1} de 50`;
  document.getElementById("questaoTexto").textContent = q.q;
  document.getElementById("contPular").textContent = respondente.pular_usados;
  document.getElementById("contEliminar").textContent = respondente.eliminar_usados;
  document.getElementById("contAjuda").textContent = respondente.ajuda_usados;
  
  document.getElementById("btnPular").disabled = respondente.pular_usados <= 0;
  document.getElementById("btnEliminar").disabled = respondente.eliminar_usados <= 0;
  document.getElementById("btnAjuda").disabled = respondente.ajuda_usados <= 0;
  
  const opDiv = document.getElementById("opcoes");
  opDiv.innerHTML = "";
  eliminadas = [];
  
  for (let i = 0; i < q.opcoes.length; i++) {
    const div = document.createElement("div");
    div.className = "opcao";
    div.textContent = ["A", "B", "C", "D"][i] + ") " + q.opcoes[i];
    div.onclick = () => responder(i);
    opDiv.appendChild(div);
  }
  
  document.getElementById("resultadoArea").innerHTML = "";
  document.getElementById("btnProximo").style.display = "none";
  respondidaSessao = false;
  tempoAtual = 60;
  iniciarTimer();
}

function iniciarTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    tempoAtual--;
    const timerEl = document.getElementById("timer");
    timerEl.textContent = tempoAtual;
    if (tempoAtual <= 10) {
      timerEl.classList.add("aviso");
    } else {
      timerEl.classList.remove("aviso");
    }
    if (tempoAtual <= 0) pular();
  }, 1000);
}

function responder(opcao) {
  if (respondidaSessao) return;
  respondidaSessao = true;
  clearInterval(timerInterval);
  
  const q = respondente.questoes[respondente.idx_atual];
  const acertou = opcao === q.resp;
  
  respondente.respostas.push({
    questao: q.q,
    resposta: opcao,
    correta: q.resp,
    acertou: acertou
  });
  
  const resultDiv = document.createElement("div");
  resultDiv.className = "resultado " + (acertou ? "acerto" : "erro");
  resultDiv.textContent = acertou ? "✅ ACERTOU!" : "❌ ERROU!";
  document.getElementById("resultadoArea").innerHTML = resultDiv.innerHTML;
  
  document.getElementById("btnProximo").style.display = "block";
}

function pular() {
  if (respondidaSessao && respondente.respostas.length === respondente.idx_atual + 1) return;
  
  clearInterval(timerInterval);
  
  if (respondente.pular_usados > 0) {
    respondente.pular_usados--;
    respondente.idx_atual++;
    carregarQuestao();
  }
}

function eliminar() {
  const q = respondente.questoes[respondente.idx_atual];
  const opcao_correta = q.resp;
  
  const incorretas = [0, 1, 2, 3].filter(i => i !== opcao_correta);
  eliminadas = [];
  
  while (eliminadas.length < 2 && incorretas.length > 0) {
    const idx = Math.floor(Math.random() * incorretas.length);
    eliminadas.push(incorretas[idx]);
    incorretas.splice(idx, 1);
  }
  
  const opcoes = document.querySelectorAll(".opcao");
  eliminadas.forEach(i => opcoes[i].classList.add("desabilitada"));
  
  respondente.eliminar_usados--;
  document.getElementById("btnEliminar").disabled = true;
}

function ajuda() {
  const q = respondente.questoes[respondente.idx_atual];
  const opcao_correta = q.resp;
  
  const sabotado = Math.random() < 0.30;
  let resposta;
  
  if (sabotado) {
    const erradas = [0, 1, 2, 3].filter(i => i !== opcao_correta);
    resposta = erradas[Math.floor(Math.random() * erradas.length)];
  } else {
    resposta = opcao_correta;
  }
  
  const resultDiv = document.createElement("div");
  resultDiv.className = "resultado " + (sabotado ? "sabotado" : "acerto");
  resultDiv.textContent = (sabotado ? "⚠️ SABOTADO! " : "💡 ") + "Resposta sugerida: " + ["A", "B", "C", "D"][resposta];
  document.getElementById("resultadoArea").innerHTML = resultDiv.innerHTML;
  
  respondente.ajuda_usados--;
  document.getElementById("btnAjuda").disabled = true;
}

function proximaQuestao() {
  respondente.idx_atual++;
  carregarQuestao();
}

function registrarAbandono() {
  const acertos = respondente.respostas.filter(r => r.acertou).length;
  const nota = (acertos / 50) * 10;
  
  const payload = {
    nome: respondente.nome,
    ra: respondente.ra,
    programa: respondente.programa,
    ip: respondente.ip,
    inicio: respondente.inicio,
    acertos: acertos,
    nota: nota.toFixed(2),
    abandonado: true,
    detalhes: respondente.respostas
  };
  
  navigator.sendBeacon(WEBHOOK_URL, JSON.stringify(payload));
}

async function finalizarJogo() {
  respondente.status = "finalizado";
  clearInterval(timerInterval);
  
  const acertos = respondente.respostas.filter(r => r.acertou).length;
  const nota = (acertos / 50) * 10;
  
  const payload = {
    nome: respondente.nome,
    ra: respondente.ra,
    programa: respondente.programa,
    ip: respondente.ip,
    inicio: respondente.inicio,
    acertos: acertos,
    nota: nota.toFixed(2),
    abandonado: false,
    detalhes: respondente.respostas
  };
  
  try {
    await fetch(WEBHOOK_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });
  } catch (e) {
    console.error("Erro ao enviar dados:", e);
  }
  
  ocultar("telaJogo");
  mostrar("telaFinal");
  
  document.getElementById("statusFinal").textContent = "✅ Respostas registradas na planilha!";
  document.getElementById("textofinal").innerHTML = `
    ${nota.toFixed(2)}<br>
    <p style="font-size: 1em; margin-top: 10px;">Acertos: ${acertos} de 50 (${((acertos/50)*100).toFixed(1)}%)</p>
  `;
}

// Função para baixar relatório
function baixarRelatorio() {
  let html = "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Relatório Sabotage Time - " + respondente.nome + "</title>";
  html += "<style>body{font-family:Georgia,serif;background:#f5f5f5;padding:20px}.container{max-width:900px;margin:0 auto;background:white;padding:30px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.1)}h1{color:#D4AF37;text-align:center}.header{background:#2d2d2d;color:#F5F1E8;padding:15px;border-radius:5px;margin:20px 0}.header p{margin:5px 0}.questao{margin:20px 0;padding:15px;border-left:4px solid #D4AF37;background:#f9f9f9}.questao p{margin:8px 0}.numero{font-weight:bold;color:#D4AF37}.correta{color:green;font-weight:bold}.errada{color:red;font-weight:bold}.resumo{text-align:center;font-size:1.5em;margin:30px 0;padding:20px;background:#D4AF37;color:black;border-radius:5px}.footer{text-align:center;color:#999;margin-top:30px;font-size:0.9em}</style></head><body>";
  html += "<div class='container'><h1>⚔️ SABOTAGE TIME - RELATÓRIO</h1>";
  html += "<div class='header'><p><strong>Aluno:</strong> " + respondente.nome + "</p>";
  html += "<p><strong>RA:</strong> " + respondente.ra + "</p>";
  html += "<p><strong>Programa:</strong> " + respondente.programa + "</p>";
  html += "<p><strong>Data:</strong> " + new Date().toLocaleString('pt-BR') + "</p></div>";
  html += "<div class='resumo'><div>NOTA: " + nota.toFixed(2) + " / 10.0</div>";
  html += "<div>ACERTOS: " + acertos + " / 50 (" + ((acertos/50)*100).toFixed(1) + "%)</div></div>";
  
  respondente.questoes.forEach((q, idx) => {
    const respAluno = q.resposta_aluno !== null ? String.fromCharCode(65 + q.resposta_aluno) : "—";
    const respCorreta = String.fromCharCode(65 + q.resposta_correta);
    const acertou = q.resposta_aluno === q.resposta_correta;
    
    html += "<div class='questao'><p class='numero'>Questão " + (idx + 1) + "</p>";
    html += "<p><strong>" + q.texto + "</strong></p>";
    html += "<p><strong>Sua resposta:</strong> <span style='color:" + (acertou ? 'green' : 'red') + "'>" + respAluno + "</span></p>";
    html += "<p><strong>Resposta correta:</strong> <span class='correta'>" + respCorreta + "</span></p>";
    html += "<p><strong>Resultado:</strong> <span class='" + (acertou ? 'correta' : 'errada') + "'>" + (acertou ? '✓ CORRETO' : '✗ ERRADO') + "</span></p></div>";
  });
  
  html += "<div class='footer'><p>Relatório gerado automaticamente pelo Sabotage Time</p><p>© 2025 MTPQI - UNINOVE</p></div></div></body></html>";
  
  const blob = new Blob([html], { type: 'text/html' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Relatorio_' + respondente.ra + '_' + respondente.nome.replace(/\s+/g, '_') + '.html';
  document.body.appendChild(a);
  a.click();
  window.URL.revokeObjectURL(url);
  document.body.removeChild(a);
}
